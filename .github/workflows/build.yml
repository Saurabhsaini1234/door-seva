name: Build DoorSeva Standalone Native APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java Development Kit 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Native Engine & Add Android Container
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Inject Android Native Permissions
        run: |
          sed -i '/<application/i \
          <uses-permission android:name="android.permission.INTERNET" />\
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\
          <uses-permission android:name="android.permission.CAMERA" />\
          <uses-permission android:name="android.permission.VIBRATE" />' android/app/src/main/AndroidManifest.xml

      - name: Compile Standalone Native APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Print SHA-256 Fingerprint
        run: |
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Output APK
        uses: actions/upload-artifact@v4
        with:
          name: DoorSeva-Production-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
